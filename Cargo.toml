[package]
name = "ddd-lint"
version = "0.1.0"
description = "Opinionated domain-driven design lints for Python"
authors = ["Matic Pecovnik"]
license = "MIT"
repository = "https://github.com/mpecovnik/ddd-lint"
readme = "README.md"
edition = "2024"
rust-version = "1.95"

[lib]
name = "ddd_lint"
path = "src/lib.rs"

[[bin]]
name = "ddd-lint"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
ruff_python_ast = "=0.0.6"
ruff_python_parser = "=0.0.6"
ruff_text_size = "=0.0.6"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
